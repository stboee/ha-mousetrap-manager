<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mousetrap Manager – demo</title><style>
body{font-family:system-ui,sans-serif;background:#eef2f5;margin:0;padding:20px;color:#182532}main{max-width:1240px;margin:auto}h1{font-size:23px}p{line-height:1.5}.dark{--primary-text-color:#e9eef4;--card-background-color:#17232f;--secondary-background-color:#273745;--divider-color:#52606b;background:#0e1720;color:#e9eef4}button{padding:9px;margin-bottom:15px}
</style><script src="../custom_components/mousetrap_manager/frontend/mousetrap-manager-card.js"></script></head><body><main><h1>Mousetrap Manager 0.4.0</h1><p>Eksempeldata for visning og nettlesertester. Registrering på denne siden lagrer ingen driftshendelser.</p><button onclick="document.body.classList.toggle('dark')">Lyst / mørkt tema</button><mousetrap-manager-card></mousetrap-manager-card></main><script>
const st=(value,attributes={})=>({state:String(value),attributes});
const now=Date.now();
const action=(service,label,event_id,contextual)=>({service,label,event_id,contextual});
const base={location:'Uthus',status:'monitoring',label:'Ingen fangst meldt',scene:'normal',color:'#246c47',priority:4,show_scene:true,animations:true,warnings:[],actions:[action('inspection_completed','Inspeksjon utført','initial',false),action('bait_replaced','Åte byttet','initial',false)]};
const card=document.querySelector('mousetrap-manager-card');
const states={'sensor.dashboard':st(1,{mousetrap_manager_dashboard:true,display:{title:'Musefeller',sort:'config',columns:3,show_summary:true}}),'sensor.snap_total':st(8,{mousetrap_manager_total:true})};
const configurations=[
{...base,name:'Snap på loftet',type:'snap',label:'Overvåking aktiv',metrics:[{key:'catches',label:'Fangster',value:3},{key:'battery',label:'Batteri',value:'95%'},{key:'bait_age',label:'Åtealder',value:8,format:'days'},{key:'contact',label:'Siste sensorkontakt',value:new Date(now-2*3600000).toISOString(),format:'timestamp'}]},
{...base,name:'Snap i boden',type:'snap',status:'pending',label:'Må kontrolleres',scene:'pending',color:'#986000',priority:0,metrics:[{key:'catches',label:'Fangster',value:5},{key:'battery',label:'Batteri',value:'88%'}],actions:[action('confirm_catch','Bekreft fangst','movement',true),action('false_alarm','Falsk alarm','movement',true),action('bait_replaced','Åte byttet','initial',true)]},
{...base,name:'Victor M1 – normal',type:'victor',metrics:[{key:'catches',label:'Fangster',entity_id:'sensor.victor_total_1'},{key:'present',label:'Fangst i fellen',entity_id:'sensor.present_1'},{key:'battery',label:'Batteri',value:'95%'},{key:'bait_age',label:'Åtealder',value:4,format:'days'}]},
{...base,name:'Victor M1 – fangst',type:'victor',status:'capture',label:'Fangst meldt',scene:'capture',color:'#c51f3b',priority:0,metrics:[{key:'catches',label:'Fangster',entity_id:'sensor.victor_total_2'},{key:'present',label:'Fangst i fellen',entity_id:'sensor.present_2'}],actions:base.actions.map(a=>({...a,contextual:true}))},
{...base,name:'Victor M1 – inspeksjon',type:'victor',status:'inspection',label:'Tid for inspeksjon',scene:'inspection',color:'#986000',priority:1,metrics:[{key:'bait_age',label:'Åtealder',value:14,format:'days'},{key:'inspection_age',label:'Siden inspeksjon',value:14,format:'days'}],actions:base.actions.map(a=>({...a,contextual:true}))},
{...base,name:'Victor M1 – uten kontakt',type:'victor',status:'unavailable',label:'Utilgjengelig',scene:'unavailable',color:'#495465',priority:2,metrics:[{key:'contact',label:'Siste sensorkontakt',value:new Date(now-24*3600000).toISOString(),format:'timestamp'},{key:'battery',label:'Batteri',value:null}]}
];
configurations.forEach((p,i)=>{states['sensor.trap_'+i]=st(p.status==='unavailable'?'source_unavailable':p.status,{mousetrap_manager:true,trap_id:String(i),trap_name:p.name,presentation:p});});
states['sensor.victor_total_1']=st(4);states['sensor.present_1']=st(0);states['sensor.victor_total_2']=st(1);states['sensor.present_2']=st(1);
card.setConfig({type:'custom:mousetrap-manager-card'});
card.hass={states,callService:async()=>{},callWS:async()=>({events:[],next_cursor:null})};
</script></body></html>

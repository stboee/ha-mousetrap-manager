<!doctype html>
<html lang="nb"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mousetrap Manager – tilsyn</title><style>
body{font-family:system-ui,sans-serif;background:#eef2f5;margin:0;padding:20px;color:#182532}main{max-width:420px;margin:auto}h1{font-size:22px}p{line-height:1.5}button,select{font:inherit;padding:8px;margin-bottom:16px}.dark{--primary-text-color:#e9eef4;--card-background-color:#17232f;--secondary-background-color:#273745;--divider-color:#52606b;--primary-color:#70c7ed;background:#0e1720;color:#e9eef4}
</style><script src="../custom_components/mousetrap_manager/frontend/mousetrap-manager-card.js"></script></head><body><main><h1>Tilsyn på startsiden</h1><p>Eksempeldata i en smal murverkskolonne.</p><select aria-label="Eksempeltilstand"><option value="on">Tilsyn nødvendig</option><option value="off">Normal drift</option><option value="unavailable">Integrasjonen utilgjengelig</option><option value="target">Måladresse ikke valgt</option></select><button>Lyst / mørkt</button><div id="attention-slot"><mousetrap-manager-card></mousetrap-manager-card></div><p>Andre alarmkort kan ligge over og under tilsynskortet.</p></main><script>
const card=document.querySelector('mousetrap-manager-card');
card.setConfig({type:'custom:mousetrap-manager-card',mode:'attention'});
const data={mousetrap_manager_attention:true,schema_version:1,title:'Musefeller',count:2,summary:'2 feller trenger tilsyn',navigation_path:'/demo/index.html',items:[{name:'Garasje1',reason_text:'Fangst meldt',color:'#c51f3b',icon:'mdi:rodent'},{name:'Loft',reason_text:'Inspeksjon nødvendig',color:'#986000',icon:'mdi:clipboard-alert-outline'}]};
function show(mode){const normal=mode==='off';document.querySelector('#attention-slot').hidden=normal;card.hass={states:{'binary_sensor.demo_attention':{state:mode==='target'?'on':mode,attributes:{...data,count:normal?0:2,summary:normal?'Ingen feller trenger tilsyn':data.summary,items:normal?[]:data.items,navigation_path:mode==='target'?'':data.navigation_path}}}};}
show('on');document.querySelector('select').onchange=e=>show(e.target.value);document.querySelector('button').onclick=()=>document.body.classList.toggle('dark');
</script></body></html>

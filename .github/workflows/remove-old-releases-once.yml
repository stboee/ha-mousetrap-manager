name: Remove superseded releases (one time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/remove-old-releases-once.yml]
permissions:
  contents: read
jobs:
  prune:
    if: github.repository == 'stboee/ha-mousetrap-manager'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const repo = context.repo;
            const keep = { tag: 'v2026.11.26', id: 459961383, sha: '287107b3736cb4dbe0b70c2ed849996adfc4ee52' };
            const remove = [
              { tag: 'v0.5.0', id: 448656110, sha: 'ce193152d8210370fa2a95aa1bbf4f98b829139c' },
              { tag: 'v0.4.0', id: 430936202, sha: 'c920a7edc3f79e9a25cc5771acb3409660bd9726' },
              { tag: 'v0.3.0', id: 430858506, sha: '4159d0cc49bb6886835eeca5ead2b000a0565bdc' },
              { tag: 'v0.2.1', id: 430708025, sha: '08d9c268fdfcf8f0db67703df999c8c2d6377be8' },
              { tag: 'v0.2.0', id: 430535344, sha: '58f0cb254f4cc28fc43f35fa8e030814d00f4493' },
              { tag: 'v0.1.0', id: 426888302, sha: 'a12fc5842c5ca2b4d662bf9005f4482193124056' },
            ];
            const releases = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            const current = (await github.rest.repos.getLatestRelease(repo)).data;
            const approved = [keep, ...remove];
            if (current.id !== keep.id || current.tag_name !== keep.tag
                || releases.some(r => !approved.some(a => a.id === r.id && a.tag === r.tag_name))) {
              throw new Error('The release list changed. No releases have been removed.');
            }
            async function currentTag(tag) {
              try {
                return (await github.rest.git.getRef({ ...repo, ref: 'tags/' + tag })).data.object.sha;
              } catch (error) {
                if (error.status === 404) return null;
                throw error;
              }
            }
            if (await currentTag(keep.tag) !== keep.sha) throw new Error('The retained tag changed.');
            for (const entry of remove) {
              const sha = await currentTag(entry.tag);
              if (sha && sha !== entry.sha) throw new Error('Unexpected tag target: ' + entry.tag);
            }
            for (const entry of remove) {
              if (releases.some(r => r.id === entry.id)) {
                await github.rest.repos.deleteRelease({ ...repo, release_id: entry.id });
              }
              if (await currentTag(entry.tag) === entry.sha) {
                await github.rest.git.deleteRef({ ...repo, ref: 'tags/' + entry.tag });
              }
              core.info('Removed old release and tag: ' + entry.tag);
            }
            const remaining = await github.paginate(github.rest.repos.listReleases, { ...repo, per_page: 100 });
            if (remaining.length !== 1 || remaining[0].id !== keep.id || await currentTag(keep.tag) !== keep.sha) {
              throw new Error('Final release inventory differs from the requested result.');
            }
